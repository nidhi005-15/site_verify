<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload File — CiteVerify</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <img src="./assests/takeoff-the-plane-svgrepo-com.svg" alt="Logo" class="header-logo" />
      <h1>Bring your PDF, JSON, or CSV file. We'll verify it from here.</h1>
    </div>

    <div class="container">
      <input
        type="file"
        id="upload-button"
        accept=".pdf,.json,.csv,application/pdf,application/json,text/csv"
      />
      <label for="upload-button">
        <img src="./assests/man-with-ascending-arrow-svgrepo-com.svg" alt="" />
        Choose Or Drop PDF, JSON, or CSV File
      </label>
      <div id="error"></div>
      <div id="image-display"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
